name: One-off chart

on:
  push:
    branches: [claude/project-thread-bmqqu0]
    paths: [tools/chart_one.py, .github/workflows/chart-one.yml]

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests matplotlib pillow
      - run: python tools/chart_one.py
        env:
          CHART_SYMBOLS: POLICYBZR
      - name: Save chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/charts
          git diff --cached --quiet || git commit -m "One-off chart $(date -u +%F-%H%M)"
          git push
