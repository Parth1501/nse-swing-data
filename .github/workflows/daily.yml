name: Daily NSE data

on:
  workflow_dispatch:           # started by the Claude routine at 6:45 PM IST (Mon-Fri), or by hand from the Actions tab

permissions:
  contents: write

concurrency:                   # one run at a time; a second run waits instead of clashing
  group: daily-nse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - run: python scan_data.py
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F-%H%M)"
          git pull --rebase origin "$GITHUB_REF_NAME"   # the branch this run started on (main for the daily run)
          git push
