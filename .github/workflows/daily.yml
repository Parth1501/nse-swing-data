name: Daily NSE data

on:
  schedule:
    - cron: "15 13 * * 1-5"   # 6:45 PM IST, Monday to Friday (times here are UTC)
    - cron: "30 14 30 9 *"    # one-off test: 8:00 PM IST on 30 Sep only (remove after)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:                   # one run at a time; a second run waits instead of clashing
  group: daily-nse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - run: python scan_data.py
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F-%H%M)"
          git pull --rebase origin main
          git push
