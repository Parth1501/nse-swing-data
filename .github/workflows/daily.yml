name: Daily NSE data

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 6:00 PM IST, after market close
    - cron: "15 1 * * 1-5"    # 6:45 AM IST, backup before the 8:17 scan
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - run: python scan_data.py
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F-%H%M)"
          git push
