name: Muhurat pick research

on:
  push:
    branches: [claude/project-thread-i7zvee]
    paths: ["muhurat/*.py", "muhurat/run_stamp.txt", ".github/workflows/muhurat.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - run: python muhurat/muhurat_scan.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muhurat/out
          git diff --cached --quiet && exit 0
          git commit -q -m "Muhurat research $(TZ=Asia/Kolkata date +%F-%H%M)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
