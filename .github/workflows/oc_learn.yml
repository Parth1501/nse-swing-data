name: Nifty option chain patterns

on:
  workflow_dispatch:           # started hourly in market hours (just after each snapshot) by the Claude routine, or by hand

permissions:
  contents: write

concurrency:
  group: nifty-oc-patterns
  cancel-in-progress: false

jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - name: Update the pattern log and save it
        run: |
          # Start each try from the latest copy of the branch so the snapshot runs' pushes never clash.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME" || { sleep $((i * 5)); continue; }
            python oc_learn.py
            git add data/oc_learning data/nifty_trend
            git diff --cached --quiet && exit 0
            git commit -q -m "Option chain patterns $(TZ=Asia/Kolkata date +%F-%H%M)"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
