name: Nifty option chain

on:
  workflow_dispatch:           # started every hour (9:15 to 15:15 IST, Mon-Fri) by the Claude routine, or by hand
    inputs:
      second_snapshot:
        description: "Also take a second snapshot 30 minutes later (the routine's runs do)"
        required: false
        default: "yes"
      sensex_probe:
        description: "Only print Upstox's raw Sensex answer (for checking the field mapping); saves nothing"
        required: false
        default: "no"
      probe_index:
        description: "With sensex_probe=yes: which Upstox index to probe (sensex, banknifty, midcpselect)"
        required: false
        default: "sensex"

permissions:
  contents: write

concurrency:
  group: ${{ inputs.sensex_probe == 'yes' && 'sensex-probe' || 'nifty-option-chain' }}   # a probe never waits behind a snapshot run
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Sensex probe
        if: inputs.sensex_probe == 'yes'
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          CHAIN_INDEX: ${{ inputs.probe_index }}
        run: python sensex_chain.py --probe
      - name: Snapshot now
        if: inputs.sensex_probe != 'yes'
        run: python option_chain.py && bash .github/save_option_chain.sh
      - name: Sensex snapshot now
        if: inputs.sensex_probe != 'yes'
        continue-on-error: true      # a Sensex problem never blocks the Nifty snapshots
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python sensex_chain.py && bash .github/save_sensex_chain.sh
      - name: Bank Nifty snapshot (saved only) now
        if: inputs.sensex_probe != 'yes'
        continue-on-error: true      # never blocks Nifty or Sensex
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          for ix in banknifty; do
            CHAIN_INDEX=$ix python sensex_chain.py && bash .github/save_index_chain.sh $ix || echo "$ix snapshot failed"
          done
      - name: Snapshot 30 minutes later
        if: inputs.second_snapshot != 'no' && inputs.sensex_probe != 'yes'
        run: sleep 1800 && python option_chain.py && bash .github/save_option_chain.sh
      - name: Sensex snapshot 30 minutes later
        if: inputs.second_snapshot != 'no' && inputs.sensex_probe != 'yes'
        continue-on-error: true
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python sensex_chain.py && bash .github/save_sensex_chain.sh
      - name: Bank Nifty snapshot (saved only) 30 minutes later
        if: inputs.second_snapshot != 'no' && inputs.sensex_probe != 'yes'
        continue-on-error: true      # never blocks Nifty or Sensex
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          for ix in banknifty; do
            CHAIN_INDEX=$ix python sensex_chain.py && bash .github/save_index_chain.sh $ix || echo "$ix snapshot failed"
          done
