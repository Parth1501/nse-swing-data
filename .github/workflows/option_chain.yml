name: Nifty option chain

on:
  workflow_dispatch:           # started every hour (9:15 to 15:15 IST, Mon-Fri) by the Claude routine, or by hand
    inputs:
      second_snapshot:
        description: "Also take a second snapshot 30 minutes later (the routine's runs do)"
        required: false
        default: "yes"
      sensex_probe:
        description: "Only print Dhan's raw Sensex answer (for checking the field mapping); saves nothing"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: nifty-option-chain
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Sensex probe
        if: inputs.sensex_probe == 'yes'
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python sensex_chain.py --probe
      - name: Snapshot now
        if: inputs.sensex_probe != 'yes'
        run: python option_chain.py && bash .github/save_option_chain.sh
      - name: Sensex snapshot now
        if: inputs.sensex_probe != 'yes'
        continue-on-error: true      # a Sensex problem never blocks the Nifty snapshots
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python sensex_chain.py && bash .github/save_sensex_chain.sh
      - name: Snapshot 30 minutes later
        if: inputs.second_snapshot != 'no' && inputs.sensex_probe != 'yes'
        run: sleep 1800 && python option_chain.py && bash .github/save_option_chain.sh
      - name: Sensex snapshot 30 minutes later
        if: inputs.second_snapshot != 'no' && inputs.sensex_probe != 'yes'
        continue-on-error: true
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python sensex_chain.py && bash .github/save_sensex_chain.sh
