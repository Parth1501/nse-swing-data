name: Nifty option chain

on:
  schedule:                    # every 30 min, 9:15 to 15:30 IST, Mon-Fri (cron is UTC; GitHub may start a few minutes late)
    - cron: "45 3 * * 1-5"
    - cron: "15,45 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:           # or by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: nifty-option-chain
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python option_chain.py
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/option_chain
          git diff --cached --quiet && exit 0
          git commit -m "Option chain $(TZ=Asia/Kolkata date +%F-%H%M)"
          for i in 1 2 3 4; do                       # the daily data run may push at the same time
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
