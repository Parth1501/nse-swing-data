name: Nifty option chain

on:
  workflow_dispatch:           # started every hour (9:15 to 15:15 IST, Mon-Fri) by the Claude routine, or by hand
    inputs:
      second_snapshot:
        description: "Also take a second snapshot 30 minutes later (the routine's runs do)"
        required: false
        default: "yes"

permissions:
  contents: write

concurrency:
  group: nifty-option-chain
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Snapshot now
        run: python option_chain.py && bash .github/save_option_chain.sh
      - name: Snapshot 30 minutes later
        if: inputs.second_snapshot != 'no'
        run: sleep 1800 && python option_chain.py && bash .github/save_option_chain.sh
